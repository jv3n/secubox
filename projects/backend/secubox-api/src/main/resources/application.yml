spring:
  application:
    name: secubox-api

  data:
    mongodb:
      uri: mongodb://localhost:27018/secubox
      auto-index-creation: true

  webflux:
    base-path: /api

  # Development optimizations
  devtools:
    restart:
      enabled: false  # Use JVM hot reload instead
    livereload:
      enabled: false

  # Lazy initialization for faster startup
  main:
    lazy-initialization: true

server:
  port: 8080

logging:
  level:
    com.secubox: DEBUG
    org.springframework.data.mongodb: INFO  # Reduced logging for faster startup

# File storage configuration
storage:
  base-path: ./storage
  max-file-size: 104857600 # 100MB in bytes
